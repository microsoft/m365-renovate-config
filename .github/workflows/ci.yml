name: CI
on:
  pull_request:
  push:
    branches:
      - main
      # validate configs that are pushed to a branch
      - 'v[0-9]*'
  # run weekly to validate against renovate changes
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - run: printenv | sort

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: yarn
          node-version-file: .nvmrc

      - run: yarn --immutable

      - name: Check token
        run: yarn check-token "$TOKEN"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: yarn format:check

      - name: Check readme
        run: yarn update-readme --check

      - name: Type check scripts
        run: yarn build

      - name: Lint presets
        run: yarn lint

      - name: Basic preset validation
        run: yarn test:basic
        id: validate

      - name: Upload validation logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.validate.outcome != 'skipped' }}
        with:
          path: renovate.validate.log
          name: renovate-validate-log

      - name: Renovate dry run with all presets
        run: yarn test:full
        id: dryRun
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dry run logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.dryRun.outcome != 'skipped' }}
        with:
          path: renovate.log
          name: renovate-dry-run-log
